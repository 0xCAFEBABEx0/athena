# Dependabot version updates.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# - PRs target `development` (the start of development -> preview -> main).
#   Security updates ignore `target-branch` and always open against `main`.
# - One `bun` entry at the repo root covers every workspace (apps/*, packages/*)
#   through the single root bun.lock.
# - After merging a @payloadcms/* bump, run `bun run generate:importmap` and
#   commit the result (see AGENTS.md).

version: 2

updates:
  - package-ecosystem: bun
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # Scoped wildcards like '@payloadcms/*' did not match on the bun
      # ecosystem (first run, 2026-11-03: @payloadcms/*, @astrojs/vercel and
      # @sentry/nextjs all landed in production-dependencies), so scoped
      # packages are also listed by exact name. Add new scoped deps here.
      # payload and every @payloadcms/* package must move in lockstep.
      payload:
        patterns:
          - payload
          - '@payloadcms/*'
          - '@payloadcms/db-postgres'
          - '@payloadcms/next'
          - '@payloadcms/plugin-form-builder'
          - '@payloadcms/plugin-nested-docs'
          - '@payloadcms/plugin-redirects'
          - '@payloadcms/plugin-search'
          - '@payloadcms/plugin-seo'
          - '@payloadcms/richtext-lexical'
          - '@payloadcms/storage-vercel-blob'
          - '@payloadcms/ui'
      astro:
        patterns:
          - astro
          - '@astrojs/*'
          - '@astrojs/check'
          - '@astrojs/vercel'
      next-react:
        patterns:
          - next
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      sentry:
        patterns:
          - '@sentry/*'
          - '@sentry/nextjs'
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
          - '@tailwindcss/typography'
          - '@tailwindcss/vite'
          - '@tailwindcss/postcss'
          - daisyui
      # Everything else: batch minor/patch bumps into one PR per side.
      # The exclusions keep the named groups above out of these catch-alls.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - payload
          - '@payloadcms*'
          - astro
          - '@astrojs*'
          - '@sentry*'
          - tailwindcss
          - '@tailwindcss*'
          - daisyui
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
        exclude-patterns:
          - payload
          - '@payloadcms*'
          - astro
          - '@astrojs*'
          - '@sentry*'
          - tailwindcss
          - '@tailwindcss*'
          - daisyui
    ignore:
      # Node is pinned to 24.x (.nvmrc / engines); skip @types/node majors.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # payload / @payloadcms/next peer-depend on graphql ^16.
      - dependency-name: graphql
        update-types:
          - version-update:semver-major
      # apps/cms is on TS 7 already; apps/web stays on 6 because astro check
      # doesn't support TS 7 yet (experimental: @astrojs/ts-content-mapper, 7.1+).
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    commit-message:
      prefix: 'ci(deps)'
    groups:
      github-actions:
        patterns:
          - '*'
